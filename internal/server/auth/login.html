<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>metacubexd · 登录</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-200: #f5f5f5;
    --bg-300: #e5e5e5;
    --content: #1f2937;
    --content-60: rgba(31, 41, 55, 0.6);
    --content-80: rgba(31, 41, 55, 0.8);
    --primary: #570df8;
    --primary-12: rgba(87, 13, 248, 0.12);
    --error: #f87272;
    --error-15: rgba(248, 114, 114, 0.15);
    --border: rgba(31, 41, 55, 0.1);
    --border-hover: rgba(31, 41, 55, 0.2);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d232a;
      --bg-200: #243041;
      --bg-300: #2d3a4f;
      --content: #a6adbb;
      --content-60: rgba(166, 173, 187, 0.6);
      --content-80: rgba(166, 173, 187, 0.8);
      --primary: #aab7ff;
      --primary-12: rgba(170, 183, 255, 0.12);
      --error: #f87272;
      --error-15: rgba(248, 114, 114, 0.15);
      --border: rgba(166, 173, 187, 0.15);
      --border-hover: rgba(166, 173, 187, 0.25);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Ubuntu', 'PingFang SC', 'Hiragino Sans GB',
      'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif;
    background: var(--bg);
    color: var(--content);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 28rem;
    animation: spring-up 380ms cubic-bezier(0.16, 1, 0.3, 1) backwards;
  }
  .logo-wrap {
    text-align: center;
    margin-bottom: 2rem;
  }
  .logo-box {
    width: 4rem;
    height: 4rem;
    margin: 0 auto 1rem;
    border-radius: 1rem;
    background: var(--primary-12);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-box svg { width: 2rem; height: 2rem; }
  .title {
    font-size: 1.875rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--content);
    margin-bottom: 0.5rem;
  }
  .title .xd { color: var(--primary); text-decoration: none; }
  .title .dim { color: var(--content-60); }
  .subtitle {
    font-size: 0.9375rem;
    color: var(--content-80);
  }
  .form {
    margin-top: 2rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .input-wrap {
    position: relative;
  }
  .input {
    width: 100%;
    padding: 0.75rem 1rem;
    font-size: 0.9375rem;
    font-family: inherit;
    color: var(--content);
    background: var(--bg-200);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    outline: none;
    transition: border-color 200ms, background-color 200ms;
  }
  .input:focus {
    border-color: var(--primary);
    background: var(--bg);
  }
  .input::placeholder { color: var(--content-60); }
  .btn {
    width: 100%;
    padding: 0.75rem 1rem;
    font-size: 0.9375rem;
    font-weight: 500;
    font-family: inherit;
    color: var(--bg);
    background: var(--primary);
    border: none;
    border-radius: 0.75rem;
    cursor: pointer;
    /* Hover uses box-shadow only (no translateY): translating the button can
       move it out from under the cursor on tight hit boxes, causing a
       hover/leave feedback loop (= visual jitter). A shadow fade conveys
       the same lift without touching layout. */
    box-shadow: 0 0 0 rgba(0, 0, 0, 0);
    transition: box-shadow 220ms cubic-bezier(0.4, 0, 0.2, 1),
                filter 160ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .btn:hover {
    /* filter:brightness gives a subtle tactile response that, unlike
       transform, never changes the hit region. */
    filter: brightness(1.08);
    box-shadow: 0 6px 18px var(--primary-12);
  }
  .btn:active {
    filter: brightness(0.95);
    transition: filter 80ms cubic-bezier(0.4, 0, 0.6, 1);
  }
  .error {
    color: var(--error);
    background: var(--error-15);
    padding: 0.625rem 0.875rem;
    border-radius: 0.5rem;
    font-size: 0.875rem;
    text-align: center;
    animation: shake-soft 420ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes spring-up {
    from { opacity: 0; transform: translateY(14px) scale(0.985); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes shake-soft {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-3px); }
    40%, 60% { transform: translateX(3px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .error, .btn { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <div class="logo-box">
        <!-- Tabler "server" icon outline, matching setup.vue -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="6" rx="2"/>
          <rect x="3" y="14" width="18" height="6" rx="2"/>
          <line x1="7" y1="7" x2="7" y2="7"/>
          <line x1="7" y1="17" x2="7" y2="17"/>
        </svg>
      </div>
      <h1 class="title">
        <span>metacube</span><span class="dim">(</span><span class="xd">xd</span><span class="dim">)</span>
      </h1>
      <p class="subtitle">请输入访问密码以继续</p>
    </div>
    <p id="error" class="error" hidden>密码错误，请重试</p>
    <form id="login-form" class="form" autocomplete="on">
      <div class="input-wrap">
        <input id="password" class="input" type="password" name="password"
               placeholder="密码" required autofocus
               aria-label="密码">
      </div>
      <button id="submit" class="btn" type="submit">登录</button>
    </form>
  </div>
  <script>
    (function () {
      'use strict';
      var form = document.getElementById('login-form');
      var input = document.getElementById('password');
      var errBox = document.getElementById('error');
      var submitBtn = document.getElementById('submit');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var password = input.value;
        if (!password) return;

        // Lock the UI while the request is in flight so a double-submit
        // can't race the cookie set.
        submitBtn.disabled = true;
        submitBtn.textContent = '验证中…';
        errBox.hidden = true;

        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password }),
          // Same-origin cookies are required (we set the session cookie on
          // success); include them unconditionally.
          credentials: 'same-origin',
        }).then(function (resp) {
          if (resp.ok) {
            // Server returns {ok:true, redirect:"/path"}. Honor the
            // next-path hint so e.g. /overview deep links bounce back.
            return resp.json().then(function (data) {
              window.location.assign(data.redirect || '/');
            });
          }
          // 401 (or any non-ok): show error and re-enable the form.
          errBox.hidden = false;
          input.select();
          throw new Error('login failed');
        }).catch(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = '登录';
        }).finally(function () {
          // Re-enable in the success path too — though we're navigating away,
          // so this mostly covers the brief window before the redirect.
          submitBtn.disabled = false;
          submitBtn.textContent = '登录';
        });
      });
    })();
  </script>
</body>
</html>
