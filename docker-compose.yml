# docker compose up — run the All-in-One server from a pre-built image.
#
# Quick start:
#   docker compose up -d
#
# TUN mode:
#   Uncomment cap_add + devices below, or switch to network_mode: host.
#
# Host networking (alternative to port mapping):
#   Uncomment network_mode: host below. The server binds directly to host
#   interfaces — no port mapping needed, and mihomo can reach host services.
#   Note: port conflicts are your responsibility; Docker Desktop on
#   macOS/Windows does not support host networking.

services:
  server:
    image: ghcr.io/sion10032/metacubexd-server-go:latest
    container_name: metacubexd-server
    restart: unless-stopped
    # ── Port mapping (default) ──────────────────────────────────────
    ports:
      - "8080:8080"   # dashboard + control/clash API
      - "7890:7890"   # mihomo mixed proxy
      # 9090 intentionally NOT published — internal-only
    # ── Host networking (alternative) ───────────────────────────────
    # When enabled, ports above are ignored; the server binds :8080/:7890
    # directly on the host. Useful for TUN mode or when the server needs
    # to reach services on the host network (e.g. local DNS, WireGuard).
    # Not supported on Docker Desktop for macOS/Windows.
    # network_mode: host
    volumes:
      - ./data:/data
    environment:
      # All env vars have Dockerfile defaults; override here for secrets.
      CONTROL_TOKEN: ""        # set to a random string to enable login auth
      CLASH_SECRET: ""         # mihomo external-controller secret (auto-generated if empty)
      TZ: Asia/Shanghai
      # Match host user uid/gid so bind-mounted ./data is writable.
      PUID: 1000
      PGID: 1000
      # GITHUB_TOKEN: ghp_xxx   # optional: authenticated GitHub rate limit for downloads
    # TUN mode — uncomment to enable mihomo TUN:
    # cap_add:
    #   - NET_ADMIN
    # devices:
    #   - /dev/net/tun
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/control/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
