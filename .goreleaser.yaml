version: 2

project_name: metacubexd-server-go

before:
  hooks:
    - bash scripts/fetch-ui.sh

builds:
  - main: ./cmd/metacubexd-server
    binary: metacubexd-server-go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .Date }}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: deploy/systemd/metacubexd.service
      - src: deploy/systemd/metacubexd.env.sample
      - src: deploy/openrc/metacubexd.initd
      - src: deploy/openrc/metacubexd.confd
      - src: deploy/metacubexd-ctl.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
